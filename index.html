<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SQUAD TIME</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --cls-blue: #007bff;
            --cls-purple: #bd00ff;
            --cls-cyan: #0ff;
            --tg-theme-bg: var(--tg-theme-bg-color, #ffffff);
            --tg-theme-text: var(--tg-theme-text-color, #000000);
            --tg-theme-hint: var(--tg-theme-hint-color, #999999);
            --tg-theme-sec-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            background: var(--tg-theme-bg);
            color: var(--tg-theme-text);
            margin: 0; padding: 20px; 
            overflow: hidden; user-select: none;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh;
        }

        /* Заголовки на русском */
        h2 { margin-top: 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: var(--tg-theme-hint); text-shadow: 0 0 10px var(--cls-cyan); }
        
        .time-display {
            font-size: 80px; font-weight: 200; 
            color: var(--tg-theme-text);
            text-shadow: 0 0 20px rgba(189, 0, 255, 0.4);
            cursor: pointer; margin: -10px 0;
        }

        .clock-scene { position: relative; width: 300px; height: 300px; margin: 0 auto; }

        .clock-face { 
            position: absolute; width: 100%; height: 100%;
            background: var(--tg-theme-sec-bg);
            opacity: 0.95; border-radius: 50%; 
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .center-dot { 
            position: absolute; width: 6px; height: 6px; 
            background: var(--cls-blue); border-radius: 50%; 
            left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--cls-blue); z-index: 10;
        }

        .number { 
            position: absolute; width: 44px; height: 44px; border-radius: 50%; 
            line-height: 44px; text-align: center; font-size: 17px; font-weight: 500;
            color: var(--tg-theme-text); cursor: pointer; transition: 0.2s;
            z-index: 5; display: flex; align-items: center; justify-content: center;
        }

        .number.selected {
            color: #fff !important;
            background: var(--cls-blue);
            box-shadow: 0 0 15px var(--cls-blue);
            transform: scale(1.1); 
        }

        /* Кнопка на русском */
        .btn-confirm { 
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--cls-blue), var(--cls-purple));
            color: #fff; border: none; padding: 18px; 
            font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            border-radius: 16px; width: 100%; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h2 id="header-label">УСТАНОВИТЕ ЧАСЫ</h2>
    <div class="time-display" id="display" onclick="switchMode('hours')">
        <span id="h_val">19</span>:<span id="m_val">00</span>
    </div>
    
    <div class="clock-scene">
        <div class="clock-face" id="clock">
            <div class="center-dot"></div>
        </div>
    </div>
    
    <button class="btn-confirm" onclick="sendTime()">ЗАПУСТИТЬ СБОР</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentHour = 19;
        let currentMinute = 0;
        let mode = 'hours';
        const clock = document.getElementById('clock');
        const h_val = document.getElementById('h_val');
        const m_val = document.getElementById('m_val');
        const header = document.getElementById('header-label');

        function updateDisplay() {
            h_val.innerText = currentHour.toString().padStart(2, '0');
            m_val.innerText = currentMinute.toString().padStart(2, '0');
        }

        function switchMode(newMode) {
            if (mode === newMode) return;
            tg.HapticFeedback.impactOccurred('medium'); 
            mode = newMode;
            header.innerText = mode === 'hours' ? 'УСТАНОВИТЕ ЧАСЫ' : 'УСТАНОВИТЕ МИНУТЫ';
            drawClock();
        }

        function drawClock() {
            clock.innerHTML = '<div class="center-dot"></div>';
            let values = [];
            
            if (mode === 'hours') {
                for (let i = 0; i < 24; i++) {
                    let r = i < 12 ? 70 : 110; 
                    let angle = (i % 12) * 30 - 90;
                    values.push({v: i, r: r, a: angle});
                }
            } else {
                for (let i = 0; i < 60; i += 5) {
                    values.push({v: i, r: 110, a: i * 6 - 90});
                }
            }

            values.forEach(item => {
                let num = document.createElement('div');
                num.className = 'number';
                if ((mode === 'hours' && currentHour === item.v) || (mode === 'minutes' && currentMinute === item.v)) {
                    num.classList.add('selected');
                }
                
                num.innerText = item.v.toString().padStart(2, '0');
                
                let rad = item.a * (Math.PI / 180);
                // Позиционирование без поворота самих элементов
                let x = 150 + item.r * Math.cos(rad) - 22;
                let y = 150 + item.r * Math.sin(rad) - 22;
                
                num.style.left = `${x}px`;
                num.style.top = `${y}px`;
                
                num.onclick = () => {
                    tg.HapticFeedback.impactOccurred('light'); 
                    if (mode === 'hours') {
                        currentHour = item.v;
                        updateDisplay();
                        switchMode('minutes'); 
                    } else {
                        currentMinute = item.v;
                        updateDisplay();
                        drawClock(); 
                    }
                };
                clock.appendChild(num);
            });
        }

        function sendTime() {
            tg.HapticFeedback.notificationOccurred('success'); 
            tg.sendData(`${currentHour.toString().padStart(2, '0')}:${currentMinute.toString().padStart(2, '0')}`);
        }

        drawClock();
    </script>
</body>
</html>
