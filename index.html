<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор времени</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/mdtimepicker@2.0.2/dist/mdtimepicker.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mdtimepicker@2.0.2/dist/mdtimepicker.min.js"></script>
    
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        
        #timePicker {
            font-size: 32px;
            padding: 15px 20px;
            border-radius: 12px;
            border: 2px solid var(--tg-theme-button-color, #3390ec);
            text-align: center;
            cursor: pointer;
            margin-bottom: 30px;
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            width: 150px;
            outline: none;
        }
        
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Во сколько старт?</h2>
    
    <input type="text" id="timePicker" value="19:00" readonly>
    
    <br>
    <button onclick="sendTimeToBot()">Подтвердить</button>

    <script>
        // Говорим Телеграму растянуть окно
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        // Запускаем отрисовку циферблата (чистый JS)
        mdtimepicker('#timePicker', {
            is24hour: true,
            format: 'hh:mm',
            theme: 'blue',
            clearBtn: false
        });

        // Отправка в бота
        function sendTimeToBot() {
            let selectedTime = document.getElementById('timePicker').value;
            if (selectedTime) {
                tg.sendData(selectedTime);
            } else {
                tg.showAlert("Выберите время!");
            }
        }
    </script>
</body>
</html>
