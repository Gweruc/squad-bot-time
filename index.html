<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выбор времени</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-color: var(--tg-theme-button-color, #3390ec);
            --tg-bg: var(--tg-theme-bg-color, #ffffff);
            --tg-text: var(--tg-theme-text-color, #000000);
            --tg-hint: var(--tg-theme-hint-color, #999999);
            --tg-sec-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            background: var(--tg-bg); 
            color: var(--tg-text); 
            margin: 0; 
            padding: 20px; 
            overflow: hidden;
            user-select: none;
        }

        h2 { margin-top: 5px; font-size: 20px; color: var(--tg-hint); font-weight: 500; }
        
        /* Главное табло с пульсацией */
        #display { 
            font-size: 56px; 
            font-weight: 600; 
            color: var(--tg-color); 
            margin: 15px 0 30px 0; 
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        #display:active { transform: scale(0.95); }

        /* Контейнер часов */
        .clock-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }

        .clock-face { 
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--tg-sec-bg); 
            border-radius: 50%; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .center-dot { 
            position: absolute; 
            width: 8px; 
            height: 8px; 
            background: var(--tg-color); 
            border-radius: 50%; 
            left: 50%; 
            top: 50%; 
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* Стильные цифры */
        .number { 
            position: absolute; 
            width: 42px; 
            height: 42px; 
            border-radius: 50%; 
            line-height: 42px; 
            text-align: center; 
            font-size: 16px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            z-index: 5;
        }

        .number.selected {
            background: var(--tg-color);
            color: white !important;
            box-shadow: 0 0 15px var(--tg-color);
            transform: scale(1.15);
        }

        /* Эффект переключения */
        .fade-out { opacity: 0; transform: scale(0.8); }
        .fade-in { opacity: 1; transform: scale(1); }

        /* Кнопка */
        .btn { 
            margin-top: 40px; 
            background: var(--tg-color); 
            color: white; 
            border: none; 
            padding: 16px; 
            font-size: 18px; 
            border-radius: 14px; 
            width: 100%; 
            font-weight: 600; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2 id="header-label">Выберите час</h2>
    <div id="display" onclick="switchMode('hours')">19:00</div>
    
    <div class="clock-container">
        <div class="clock-face" id="clock">
            <div class="center-dot"></div>
        </div>
    </div>
    
    <button class="btn" onclick="sendTime()">Готово</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentHour = 19;
        let currentMinute = 0;
        let mode = 'hours';
        const clock = document.getElementById('clock');
        const display = document.getElementById('display');
        const header = document.getElementById('header-label');

        function updateDisplay() {
            display.innerText = `${currentHour.toString().padStart(2, '0')}:${currentMinute.toString().padStart(2, '0')}`;
        }

        function switchMode(newMode) {
            if (mode === newMode) return;
            clock.classList.add('fade-out');
            setTimeout(() => {
                mode = newMode;
                header.innerText = mode === 'hours' ? 'Выберите час' : 'Выберите минуты';
                drawClock();
                clock.classList.remove('fade-out');
                clock.classList.add('fade-in');
            }, 200);
        }

        function drawClock() {
            clock.innerHTML = '<div class="center-dot"></div>';
            let values = [];
            let radius = 110;
            
            if (mode === 'hours') {
                for (let i = 0; i < 24; i++) {
                    let r = i < 12 ? 75 : 110; // Внутренний и внешний круги
                    let angle = (i % 12) * 30 - 90;
                    values.push({v: i, r: r, a: angle});
                }
            } else {
                for (let i = 0; i < 60; i += 5) {
                    values.push({v: i, r: 110, a: i * 6 - 90});
                }
            }

            values.forEach(item => {
                let num = document.createElement('div');
                num.className = 'number';
                if ((mode === 'hours' && currentHour === item.v) || (mode === 'minutes' && currentMinute === item.v)) {
                    num.classList.add('selected');
                }
                num.innerText = item.v.toString();
                
                let rad = item.a * (Math.PI / 180);
                let x = 140 + item.r * Math.cos(rad) - 21;
                let y = 140 + item.r * Math.sin(rad) - 21;
                
                num.style.left = x + 'px';
                num.style.top = y + 'px';
                
                num.onclick = () => {
                    if (window.TapticEngine) tg.HapticFeedback.impactOccurred('light');
                    if (mode === 'hours') {
                        currentHour = item.v;
                        updateDisplay();
                        switchMode('minutes');
                    } else {
                        currentMinute = item.v;
                        updateDisplay();
                        drawClock(); // Перерисовать для подсветки выбранной минуты
                    }
                };
                clock.appendChild(num);
            });
        }

        function sendTime() {
            tg.HapticFeedback.notificationOccurred('success');
            tg.sendData(display.innerText);
        }

        drawClock();
    </script>
</body>
</html>
