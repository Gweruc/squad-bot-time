<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор времени</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link href="https://cdn.jsdelivr.net/gh/dmuy/MDTimePicker@v2.0.0/mdtimepicker.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/dmuy/MDTimePicker@v2.0.0/mdtimepicker.min.js"></script>
    
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        
        #timePicker {
            font-size: 30px;
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid var(--tg-theme-button-color, #3390ec);
            text-align: center;
            cursor: pointer;
            margin-bottom: 30px;
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            width: 150px;
        }
        
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <h2>Во сколько старт?</h2>
    
    <input type="text" id="timePicker" value="19:00" readonly>
    
    <br>
    <button onclick="sendTimeToBot()">Подтвердить</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        // Запускаем отрисовку круглого циферблата (24-часовой формат)
        $(document).ready(function(){
            $('#timePicker').mdtimepicker({
                is24hour: true,
                format: 'hh:mm',
                theme: 'blue',
                clearBtn: false
            });
        });

        function sendTimeToBot() {
            let selectedTime = $('#timePicker').val();
            if (selectedTime) {
                tg.sendData(selectedTime);
            } else {
                tg.showAlert("Выберите время!");
            }
        }
    </script>
</body>
</html>
