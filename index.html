<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SQUAD TIME PICKER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Неоновые цвета */
            --cls-cyan: #0ff;
            --cls-blue: #007bff;
            --cls-purple: #bd00ff;
            --cls-dark: #0a0a0c;
            /* Цвета темы ТГ (для совместимости) */
            --tg-theme-bg: var(--tg-theme-bg-color, #ffffff);
            --tg-theme-text: var(--tg-theme-text-color, #000000);
            --tg-theme-hint: var(--tg-theme-hint-color, #999999);
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            /* Если тема светлая, делаем фон ТГ, если темная - наш кастомный неон */
            background: var(--tg-theme-bg-color, var(--cls-dark));
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0; padding: 20px; 
            overflow: hidden; user-select: none;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh;
        }

        /* Заголовок с неоновой тенью */
        h2 { margin-top: 10px; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; color: var(--tg-theme-hint, var(--cls-cyan)); text-shadow: 0 0 10px var(--cls-cyan); }
        
        /* Табло времени: Футуристичный шрифт и пульсация */
        .time-display {
            font-size: 80px; font-weight: 800; font-family: 'Courier New', monospace;
            color: #fff; text-shadow: 0 0 20px var(--cls-purple), 0 0 40px var(--cls-purple);
            cursor: pointer; transition: 0.2s;
            margin: -20px 0 -10px 0;
        }
        .time-display:active { transform: scale(0.95); opacity: 0.8; }
        .time-display .separator { animation: blink 1s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0.2; } }

        /* Контейнер часов (3D сцена) */
        .clock-scene {
            position: relative; width: 300px; height: 300px;
            perspective: 800px; /* Эффект 3D перспективы */
            margin: 0 auto;
        }

        /* Стеклянный циферблат (Glassmorphism) */
        .clock-face { 
            position: absolute; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.03); /* Матовое стекло */
            border-radius: 50%; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 30px rgba(255,255,255,0.05);
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            transform-style: preserve-3d;
        }

        /* Центральная неоновая точка */
        .center-dot { 
            position: absolute; width: 6px; height: 6px; 
            background: #fff; border-radius: 50%; 
            left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--cls-cyan), 0 0 30px var(--cls-cyan);
            z-index: 10;
        }

        /* Цифры: Крупные, неоновые, с 3D-вращением при клике */
        .number { 
            position: absolute; width: 48px; height: 48px; border-radius: 50%; 
            line-height: 48px; text-align: center; 
            font-size: 18px; font-weight: bold; font-family: 'Courier New', monospace;
            color: rgba(255,255,255,0.6);
            cursor: pointer; transition: all 0.3s ease, transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Эффект наведения и выбора */
        .number.selected {
            color: #fff;
            background: var(--cls-blue);
            box-shadow: 0 0 15px var(--cls-blue), 0 0 30px var(--cls-blue);
            transform: scale(1.15) translateZ(10px); /* Выходит в 3D */
            border: 1px solid #fff;
        }
        .number:not(.selected):active {
            background: rgba(255,255,255,0.1);
            color: var(--cls-cyan);
            text-shadow: 0 0 10px var(--cls-cyan);
            transform: scale(1.1);
        }

        /* Эффекты перехода режимов */
        .clock-face.rotate-hours { transform: rotateY(0deg); }
        .clock-face.rotate-minutes { transform: rotateY(180deg); } /* Вращение барабана */
        
        /* Задняя сторона барабана (минуты) */
        .minutes-side { display: none; }
        .clock-face.rotate-minutes .minutes-side { display: block; }
        .clock-face.rotate-minutes .hours-side { display: none; }

        /* Футуристичная кнопка */
        .btn-confirm { 
            margin-top: 10px; margin-bottom: 10px;
            background: linear-gradient(135deg, var(--cls-blue), var(--cls-purple));
            color: #fff; border: none; padding: 16px; 
            font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            border-radius: 14px; width: 100%; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3), 0 0 20px rgba(0,123,255,0.4);
            transition: 0.2s;
        }
        .btn-confirm:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(0,0,0,0.2); opacity: 0.9; }
    </style>
</head>
<body>

    <h2 id="header-label">GATHER SQUAD</h2>
    <div class="time-display" id="display" onclick="switchMode('hours')">
        <span id="h_val">19</span><span class="separator">:</span><span id="m_val">00</span>
    </div>
    
    <div class="clock-scene">
        <div class="clock-face rotate-hours" id="clock">
            <div class="center-dot"></div>
            </div>
    </div>
    
    <button class="btn-confirm" onclick="sendTime()">Ready to Launch</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentHour = 19;
        let currentMinute = 0;
        let mode = 'hours';
        const clock = document.getElementById('clock');
        const h_val = document.getElementById('h_val');
        const m_val = document.getElementById('m_val');
        const header = document.getElementById('header-label');

        function updateDisplay() {
            h_val.innerText = currentHour.toString().padStart(2, '0');
            m_val.innerText = currentMinute.toString().padStart(2, '0');
        }

        function switchMode(newMode) {
            if (mode === newMode) return;
            tg.HapticFeedback.impactOccurred('medium'); // Вибрация при смене режима
            mode = newMode;
            header.innerText = mode === 'hours' ? 'GATHER SQUAD' : 'SET LOBBY TIME';
            
            // Запускаем 3D анимацию вращения
            clock.className = `clock-face rotate-${mode}`;
            
            // Отрисовываем цифры с задержкой, чтобы не видно было смены в процессе вращения
            setTimeout(drawClock, 150);
        }

        function drawClock() {
            clock.innerHTML = '<div class="center-dot"></div>';
            let values = [];
            
            if (mode === 'hours') {
                // 24 часа: два круга
                for (let i = 0; i < 24; i++) {
                    let r = i < 12 ? 75 : 110; 
                    let angle = (i % 12) * 30 - 90;
                    values.push({v: i, r: r, a: angle});
                }
            } else {
                // Минуты: шаг в 5 мин
                for (let i = 0; i < 60; i += 5) {
                    // Зеркалим угол, так как сторона перевернута на 180 градусов
                    values.push({v: i, r: 110, a: (i * 6 - 90) * -1});
                }
            }

            values.forEach(item => {
                let num = document.createElement('div');
                num.className = 'number';
                if ((mode === 'hours' && currentHour === item.v) || (mode === 'minutes' && currentMinute === item.v)) {
                    num.classList.add('selected');
                }
                num.innerText = item.v.toString().padStart(2, '0');
                
                let rad = item.a * (Math.PI / 180);
                // Математика расстановки (учитываем размер контейнера и отступы цифр)
                let x = 150 + item.r * Math.cos(rad) - 24;
                let y = 150 + item.r * Math.sin(rad) - 24;
                
                num.style.left = x + 'px';
                num.style.top = y + 'px';
                
                num.onclick = () => {
                    tg.HapticFeedback.impactOccurred('light'); // Вибрация при клике на цифру
                    if (mode === 'hours') {
                        currentHour = item.v;
                        updateDisplay();
                        switchMode('minutes'); // Авто-переключение на минуты
                    } else {
                        currentMinute = item.v;
                        updateDisplay();
                        drawClock(); // Перерисовать для подсветки
                    }
                };
                clock.appendChild(num);
            });
        }

        function sendTime() {
            tg.HapticFeedback.notificationOccurred('success'); // Вибрация успеха
            let h = currentHour.toString().padStart(2, '0');
            let m = currentMinute.toString().padStart(2, '0');
            tg.sendData(`${h}:${m}`);
        }

        drawClock(); // Рисуем часы при старте
    </script>
</body>
</html>
